services:
  # Backend FastAPI Web Service
  - type: web
    name: smart-city-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-city-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

  # Frontend React Static Site
  - type: web
    runtime: static
    name: smart-city-frontend
    buildCommand: "cd frontend/cityreport && npm install && npm run build"
    staticPublishPath: "./frontend/cityreport/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-city-backend
          property: host

databases:
  - name: smart-city-db
    databaseName: cityreport
    user: postgres
    plan: free